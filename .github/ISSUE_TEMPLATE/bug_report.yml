name: Bug report
description: Report a defect in emmc-lab
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug clearly and concretely.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, crate version, or commit SHA.
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel, Raspberry Pi model, filesystem, and target device details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Command, profile, and exact steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or session artifacts
      description: Paste relevant logs or attach exported session files.
