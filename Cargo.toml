[package]
name = "emmc-lab"
version = "0.2.9"
edition = "2021"
license = "MIT"
description = "Single-binary Linux CLI for eMMC workload testing, diagnostics, health, and reporting."

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
libc = "0.2"
md-5 = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.13"
